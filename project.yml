# Swift language mode: 5.
# SWIFT_VERSION "5.0" is the Swift 5 language mode (not Swift 6).
# Xcode 16+ ships a Swift 6 compiler, but "5.0" keeps Swift 5 checking.
# Do not set SWIFT_VERSION to "5.9" — that is not a valid build setting.
# Valid SWIFT_VERSION values include "4.0", "4.2", "5.0", and "6.0".
name: Insta
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
targets:
  Insta:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Insta
        excludes:
          - "Resources/**"
      # XcodeGen has no target-level `resources` key. These must be sources
      # with an explicit resources build phase, or they are left out of the
      # bundle. Bundle.main looks them up at the app root, not in a folder.
      - path: Insta/Resources/bridge.js
        buildPhase: resources
      - path: Insta/Resources/fallback-config.json
        buildPhase: resources
      - path: Insta/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.insta
        PRODUCT_NAME: Insta
        PRODUCT_MODULE_NAME: Insta
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: Insta/Info.plist
      properties:
        CFBundleDisplayName: Insta
        CFBundleName: Insta
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Insta uses the camera only when you capture a photo or video through Instagram's website."
        NSMicrophoneUsageDescription: "Insta uses the microphone only when you record audio or video through Instagram's website."
        NSPhotoLibraryUsageDescription: "Insta uses your photo library only when you attach media through Instagram's website."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  Insta:
    build:
      targets:
        Insta: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
